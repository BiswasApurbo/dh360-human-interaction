name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy

      - name: Download Pretrained Models
        run: python scripts/download_models.py

      - name: Run Pytest Test Suite
        run: pytest

  dashboard-validate:
    name: Lint, Type Check & Build Dashboard (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kbcon-dashboard-main/kbcon-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kbcon-dashboard-main/kbcon-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run BFF Security Tests
        env:
          NODE_OPTIONS: "--import tsx"
        run: node tests/test_dh360_bff.mjs

      - name: Run Dashboard Production Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDummyKeyForBuildValidationOnly12345"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "kbcon-dashboard-4b009.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "kbcon-dashboard-4b009"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "kbcon-dashboard-4b009.appspot.com"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "743780299959"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:743780299959:web:dummy"
          DH360_API_URL: "http://127.0.0.1:8001"
          DH360_OPERATOR_TOKEN: "dh360-ci-token"
        run: npm run build
